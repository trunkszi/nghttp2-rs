[package]
name = "nghttp2-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Static CMake build and complete FFI declarations for upstream nghttp2"
links = "nghttp2"

[lib]
# The assembled declarations intentionally carry no doc comments. Doctests stay
# disabled so regenerated bindings that include upstream docs cannot turn their
# indented C examples into Rust doctests.
doctest = false

[features]
default = ["pre-release"]
pre-release = []
stable = []

[build-dependencies]
cmake = { workspace = true }
cc = { workspace = true }

[lints]
workspace = true
